version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: $APP_BITCOIN_NODE_IP
      APP_PORT: 3000
  app:
    image: >-
      ghcr.io/getumbrel/umbrel-bitcoin:v1.4.0@sha256:13a24256cdd7b1cead36c2e4dcedc699b31fc235a0e4179c8c4527f0c361e6bf
    user: '1000:1000'
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      - ${APP_BITCOIN_P2P_PORT}:${APP_BITCOIN_P2P_PORT}
      - ${APP_BITCOIN_RPC_PORT}:${APP_BITCOIN_RPC_PORT}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}
        target: /data
        read_only: false
        bind:
          create_host_path: false
    environment:
      BITCOIND_EXTRA_ARGS: '-deprecatedrpc=create_bdb'
      APPS_SUBNET: ${NETWORK_IP}/16
      P2P_PORT: ${APP_BITCOIN_P2P_PORT}
      P2P_WHITEBIND_PORT: ${APP_BITCOIN_P2P_WHITEBIND_PORT}
      RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      TOR_PORT: ${APP_BITCOIN_TOR_PORT}
      ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT}
      ZMQ_RAWTX_PORT: ${APP_BITCOIN_ZMQ_RAWTX_PORT}
      ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      ZMQ_SEQUENCE_PORT: ${APP_BITCOIN_ZMQ_SEQUENCE_PORT}
      ZMQ_HASHTX_PORT: ${APP_BITCOIN_ZMQ_HASHTX_PORT}
      TOR_HOST: ${APP_BITCOIN_TOR_PROXY_IP}
      TOR_SOCKS_PORT: '9050'
      TOR_CONTROL_PORT: '9051'
      TOR_CONTROL_PASSWORD: ${APP_BITCOIN_TOR_CONTROL_PASSWORD}
      I2P_HOST: ${APP_BITCOIN_I2P_DAEMON_IP}
      I2P_SAM_PORT: '7656'
      BITCOIND_IP: ${APP_BITCOIN_NODE_IP}
      RPC_USER: ${APP_BITCOIN_RPC_USER}
      RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
      P2P_HIDDEN_SERVICE: ${APP_BITCOIN_P2P_HIDDEN_SERVICE}
      RPC_HIDDEN_SERVICE: ${APP_BITCOIN_RPC_HIDDEN_SERVICE}
    networks:
      default:
        ipv4_address: $APP_BITCOIN_NODE_IP
  tor:
    image: >-
      ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: '1000:1000'
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu

        HASH="$$(tor --hash-password "$${TOR_CONTROL_PASSWORD}" | tail -n 1)"

        case "$${HASH}" in
          16:*) ;;
          *)
            echo "Invalid Tor control password hash" >&2
            exit 1
            ;;
        esac

        cat > /tmp/torrc <<EOF
        SocksPort 0.0.0.0:9050
        ControlPort 0.0.0.0:9051
        CookieAuthentication 1
        CookieAuthFileGroupReadable 1
        HashedControlPassword $${HASH}

        # Bitcoin Core P2P Hidden Service
        HiddenServiceDir /data/app-$${RZO_APP_ID}-p2p
        HiddenServicePort $${BITCOIN_P2P_PORT} $${BITCOIN_NODE_IP}:$${BITCOIN_TOR_PORT}

        # Bitcoin Core RPC Hidden Service
        HiddenServiceDir /data/app-$${RZO_APP_ID}-rpc
        HiddenServicePort $${BITCOIN_RPC_PORT} $${BITCOIN_NODE_IP}:$${BITCOIN_RPC_PORT}
        EOF

        exec tor -f /tmp/torrc
    volumes:
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: /tmp
      TOR_CONTROL_PASSWORD: ${APP_BITCOIN_TOR_CONTROL_PASSWORD}
      RZO_APP_ID: ${APP_ID}
      BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      BITCOIN_P2P_PORT: ${APP_BITCOIN_P2P_PORT}
      BITCOIN_TOR_PORT: ${APP_BITCOIN_TOR_PORT}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
    networks:
      default:
        ipv4_address: ${APP_BITCOIN_TOR_PROXY_IP}
  i2pd_daemon:
    image: >-
      purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    user: root
    command: '--sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error'
    restart: on-failure
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}/i2pd
        target: /home/i2pd/data
        read_only: false
        bind:
          create_host_path: false
    networks:
      default:
        ipv4_address: ${APP_BITCOIN_I2P_DAEMON_IP}
